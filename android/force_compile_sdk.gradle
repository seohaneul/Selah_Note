subprojects {
    def configureAndroid = {
        if (project.hasProperty("android")) {
            project.android {
                compileSdkVersion 34
                if (namespace == null) {
                    namespace project.group.toString()
                }
            }
        }
    }
    
    if (project.state.executed) {
        configureAndroid()
    } else {
        project.afterEvaluate { configureAndroid() }
    }
}
